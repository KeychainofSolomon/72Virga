[package]
name = "virga"
version = "1.0.0"
edition = "2021"
rust-version = "1.97.0"
description = "The Operator's wand for Annulus: two secrets on a USB stick, each locked by the Operator's words"
license = "Unlicense"
publish = false

[lib]
name = "virga"
path = "src/lib.rs"

[[bin]]
name = "virga"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

# scrypt is slow unoptimised; keep the tests quick
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 2
